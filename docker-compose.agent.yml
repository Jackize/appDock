# AppDock Agent - Docker Compose (Coolify-friendly)
#
# Required:
# - Set AGENT_API_KEY (Coolify env or .env)
#
# Optional:
# - Change published port (default 9090)

services:
  appdock-agent:
    build:
      context: .
      dockerfile: agent/Dockerfile
    image: appdock-agent:latest
    container_name: appdock-agent
    ports:
      - "${AGENT_PUBLISH_PORT:-9090}:9090"
    environment:
      - AGENT_PORT=9090
      - AGENT_API_KEY=${AGENT_API_KEY:?set AGENT_API_KEY}
      - AGENT_DATA_DIR=/data
      - AGENT_DOCKER_SOCKET=/var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - appdock_agent_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  appdock_agent_data:
