root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/appdock ."
entrypoint = "./tmp/appdock"
include_ext = ["go", "env"]
exclude_dir = ["data", "static", "tmp"]
exclude_file = []
exclude_regex = ["_test.go"]
delay = 1000
stop_on_error = true
send_interrupt = true
kill_delay = "500ms"

[log]
time = true

[misc]
clean_on_exit = true
